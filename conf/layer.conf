# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-flight"
BBFILE_PATTERN_meta-flight = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-flight = "6"

LAYERDEPENDS_meta-flight = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-flight = "wrynose"
